name: Daily Market Close Auto Update (Dividends & JGVA)

on:
  schedule:
    # 平日 16:20 JST (07:20 UTC) - 東証大引け直後（オフピーク時刻でGitHub Actions遅延を回避）
    - cron: '20 7 * * 1-5'
    # 平日 17:45 JST (08:45 UTC) - 夕方に出揃った全開示を最終網羅
    - cron: '45 8 * * 1-5'
  workflow_dispatch: # 手動実行ボタンも提供

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openpyxl requests

      - name: Run Dividend disclosure fetcher
        run: |
          python scripts/fetch_disclosures.py || echo "Dividend fetch failed, continuing JGVA..."

      - name: Update JGVA dataset from JPX & recalculate scores
        run: |
          python jgva/scripts/download_jpx.py || echo "JPX download fallback to existing"
          python jgva/scripts/build_dataset.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/disclosures.json jgva/data/data_j.xlsx jgva/data/stocks_data.js jgva/index.html
          git diff-index --quiet HEAD || git commit -m "Auto-update: Market close daily update $(date +'%Y-%m-%d %H:%M JST')"
          git pull --rebase origin main || true
          git push
